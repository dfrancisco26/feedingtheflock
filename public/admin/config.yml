# Sveltia CMS configuration — Feeding the Flock SD admin dashboard.
# Lets editors change site content through forms; every save is a Git commit
# on the branch below, which triggers a new Cloudflare Pages deploy.
# Docs: https://github.com/sveltia/sveltia-cms   Setup: see SETUP-CMS.md

backend:
  name: github
  repo: dfrancisco26/feedingtheflock
  branch: main
  # OAuth relay (Cloudflare Worker). Replace with your deployed worker URL,
  # no trailing slash and no "/callback". See SETUP-CMS.md.
  base_url: https://YOUR-AUTH-WORKER.workers.dev

# Enables local editing against your working copy without a GitHub login.
# Run `npx @sveltia/cms-proxy-server` (or `npx decap-server`) alongside
# `npm run dev`, then open http://localhost:4321/admin/index.html
local_backend: true

# Uploaded images are committed under media_folder; the site references them
# by the public_folder path. Existing images keep their stored paths on edit.
media_folder: "public/images"
public_folder: "/images"

site_url: https://feedingtheflocksd.org
logo_url: /images/logo_2026.png

collections:
  # ==================================================================
  # Site-wide settings and the homepage impact numbers.
  # ==================================================================
  - name: settings
    label: "Site Settings"
    description: "Global site details and the homepage impact numbers."
    editor:
      preview: false
    files:
      - name: site
        label: "Site Details"
        file: "src/data/site.json"
        icon: settings
        fields:
          - { name: name, label: "Organization name", widget: string }
          - { name: tagline, label: "Tagline", widget: string }
          - { name: ein, label: "EIN", widget: string }
          - { name: nonprofitDisclosure, label: "Nonprofit disclosure", widget: text }
          - { name: logo, label: "Logo", widget: image }
          - { name: email, label: "Contact email", widget: string }
          - name: address
            label: "Mailing address"
            widget: object
            fields:
              - { name: line1, label: "Street", widget: string }
              - { name: city, label: "City", widget: string }
              - { name: state, label: "State", widget: string }
              - { name: zip, label: "ZIP", widget: string }
          - name: social
            label: "Social links"
            widget: object
            fields:
              - { name: facebook, label: "Facebook URL", widget: string, required: false }
              - { name: instagram, label: "Instagram URL", widget: string, required: false }
          - { name: foodBoxFormUrl, label: "Food box sign-up form URL", widget: string, required: false }
          - name: donation
            label: "Donation"
            widget: object
            fields:
              - name: methods
                label: "Payment methods"
                label_singular: "Payment method"
                widget: list
                fields:
                  - { name: id, label: "ID", widget: string, hint: "Lowercase, no spaces (e.g. paypal)" }
                  - { name: title, label: "Title", widget: string }
                  - { name: enabled, label: "Show on site", widget: boolean, default: true }
                  - { name: link, label: "Link URL", widget: string }
                  - { name: linkText, label: "Link button text", widget: string }
                  - { name: logo, label: "Logo image", widget: image }
                  - { name: logoClass, label: "Logo CSS class", widget: string, required: false }
                  - { name: qr, label: "QR code image", widget: image }
                  - { name: blurb, label: "Short description", widget: text }
              - name: check
                label: "Check donations"
                widget: object
                fields:
                  - { name: payableTo, label: "Payable to", widget: string }
                  - name: mailTo
                    label: "Mailing address lines"
                    widget: list
                    field: { name: line, label: "Line", widget: string }
          - name: contacts
            label: "Contacts / board"
            label_singular: "Contact"
            widget: list
            fields:
              - { name: name, label: "Name", widget: string }
              - { name: role, label: "Role", widget: string }
              - { name: email, label: "Email", widget: string }

      - name: impact
        label: "Impact Stats"
        file: "src/data/impact.json"
        icon: insights
        fields:
          - { name: eyebrow, label: "Eyebrow", widget: string }
          - { name: heading, label: "Heading", widget: string }
          - { name: subheading, label: "Subheading", widget: text }
          - name: stats
            label: "Stats"
            label_singular: "Stat"
            widget: list
            fields:
              - { name: id, label: "ID", widget: string, hint: "Unique, lowercase (e.g. food)" }
              - { name: target, label: "Target number", widget: number, value_type: int }
              - { name: suffix, label: "Suffix (e.g. +)", widget: string, required: false }
              - { name: label, label: "Label", widget: string }

  # ==================================================================
  # Page content. Each file is a top-level JSON array (root list).
  # ==================================================================
  - name: content
    label: "Content"
    description: "Programs, locations, partners, gallery photos, and events."
    editor:
      preview: false
    files:
      - name: programs
        label: "Programs"
        file: "src/content/programs.json"
        icon: category
        fields:
          - name: programs
            label: "Programs"
            label_singular: "Program"
            widget: list
            root: true
            fields:
              - { name: id, label: "ID", widget: string, hint: "Unique, lowercase-hyphen (e.g. mexico-outreach)" }
              - { name: order, label: "Order", widget: number, value_type: int }
              - { name: title, label: "Title", widget: string }
              - { name: description, label: "Description", widget: text }
              - name: points
                label: "Bullet points"
                label_singular: "Point"
                widget: list
                field: { name: point, label: "Point", widget: string }

      - name: locations
        label: "Locations"
        file: "src/content/locations.json"
        icon: place
        fields:
          - name: locations
            label: "Locations"
            label_singular: "Location"
            widget: list
            root: true
            fields:
              - { name: id, label: "ID", widget: string, hint: "Unique, lowercase-hyphen" }
              - { name: order, label: "Order", widget: number, value_type: int }
              - { name: title, label: "Title", widget: string }
              - { name: description, label: "Description", widget: text }
              - name: points
                label: "Bullet points"
                label_singular: "Point"
                widget: list
                field: { name: point, label: "Point", widget: string }

      - name: partners
        label: "Partners"
        file: "src/content/partners.json"
        icon: handshake
        fields:
          - name: partners
            label: "Partners"
            label_singular: "Partner"
            widget: list
            root: true
            fields:
              - { name: id, label: "ID", widget: string, hint: "Unique, lowercase-hyphen" }
              - { name: order, label: "Order", widget: number, value_type: int }
              - { name: name, label: "Name", widget: string }
              - { name: logo, label: "Logo image", widget: image }

      - name: gallery
        label: "Gallery Photos"
        file: "src/content/gallery.json"
        icon: photo_library
        fields:
          - name: photos
            label: "Photos"
            label_singular: "Photo"
            widget: list
            root: true
            fields:
              - { name: id, label: "ID", widget: string, hint: "Unique, lowercase-hyphen" }
              - { name: order, label: "Order", widget: number, value_type: int }
              - { name: src, label: "Image", widget: image }
              - { name: alt, label: "Alt text — describe the photo", widget: string }

      - name: events
        label: "Events"
        file: "src/content/events.json"
        icon: event
        fields:
          - name: events
            label: "Events"
            label_singular: "Event"
            widget: list
            root: true
            typeKey: type
            types:
              - name: weekly
                label: "Weekly (recurs every week)"
                fields:
                  - { name: id, label: "ID", widget: string, hint: "Unique, lowercase-hyphen" }
                  - { name: title, label: "Title", widget: string }
                  - { name: time, label: "Time", widget: string }
                  - { name: description, label: "Description", widget: text }
                  - { name: weekday, label: "Weekday (0=Sun, 6=Sat)", widget: number, value_type: int, min: 0, max: 6 }
              - name: monthlyNthWeekday
                label: "Monthly (Nth weekday of the month)"
                fields:
                  - { name: id, label: "ID", widget: string, hint: "Unique, lowercase-hyphen" }
                  - { name: title, label: "Title", widget: string }
                  - { name: time, label: "Time", widget: string }
                  - { name: description, label: "Description", widget: text }
                  - { name: weekday, label: "Weekday (0=Sun, 6=Sat)", widget: number, value_type: int, min: 0, max: 6 }
                  - { name: nth, label: "Which occurrence (1-5)", widget: number, value_type: int, min: 1, max: 5 }
              - name: dates
                label: "Specific calendar dates"
                fields:
                  - { name: id, label: "ID", widget: string, hint: "Unique, lowercase-hyphen" }
                  - { name: title, label: "Title", widget: string }
                  - { name: time, label: "Time", widget: string }
                  - { name: description, label: "Description", widget: text }
                  - name: dates
                    label: "Dates (YYYY-MM-DD)"
                    label_singular: "Date"
                    widget: list
                    field: { name: date, label: "Date (YYYY-MM-DD)", widget: string }
